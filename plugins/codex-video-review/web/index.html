<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><style>/*__STYLE__*/</style></head>
<body><div class="shell">
  <header><h1>视频打标</h1></header>
  <main><section class="viewer"><div class="viewer-top"><span>视频画面</span><button id="expand" type="button" aria-pressed="false" aria-label="放大打标画面">放大打标</button></div><div class="stage" id="stage"><video id="video" playsinline preload="metadata"></video><canvas id="marks"></canvas></div>
    <div class="transport"><button id="play" type="button">播放</button><span id="time">00:00.0</span><input id="seek" type="range" min="0" max="1000" value="0"><span id="duration">00:00.0</span><button id="back" type="button">−1 帧</button><button id="forward" type="button">+1 帧</button></div>
    <div class="toolbar"><span>画面标记</span><button data-tool="pen">画笔</button><button data-tool="line">画线</button><button data-tool="arrow">箭头</button><button data-tool="box" class="active">圈选</button><button id="undo">撤销</button><button id="clear">清空</button></div>
  </section><aside><h2>这处怎么改</h2><textarea id="comment" placeholder="写修改意见，也可以直接粘贴参考图片"></textarea><div class="reference-tools"><button id="add-images" type="button">添加参考图</button><span>可直接粘贴图片，最多 5 张</span><input id="image-input" type="file" accept="image/png,image/jpeg,image/webp,image/gif" multiple hidden></div><div id="draft-images" class="reference-images" aria-live="polite"></div><div class="actions"><button id="save" class="primary">保存这处标注</button><button id="ask">发送 <span class="send-count">0</span> 条待发送标注</button></div><p id="status" role="status"></p><h2>待发送 <span id="pending-count">0</span> 条</h2><div id="notes" class="notes"></div><details id="sent-section" class="sent-section"><summary>已提交 <span id="sent-count">0</span> 条（可展开查看）</summary><div id="sent-notes" class="notes"></div></details></aside></main>
</div><script>/*__BOOT__*/</script><script>/*__SCRIPT__*/</script></body></html>
